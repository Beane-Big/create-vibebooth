server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/__ID__/ 下的其他路径都返回 index.html。
    # 禁止浏览器缓存 HTML，避免 iOS 主屏幕 Web App 拿到旧 index.html 去请求已删除的旧资源导致白屏。
    location /apps/__ID__/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri /apps/__ID__/index.html;
    }

    location /apps/__ID__/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
