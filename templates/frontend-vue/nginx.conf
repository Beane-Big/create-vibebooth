server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/__ID__/ 下的其他路径都返回 index.html。
    location /apps/__ID__/ {
        try_files $uri /apps/__ID__/index.html;
    }

    location /apps/__ID__/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
